<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>덩크시티 선수 스탯 · DCD.GG</title>
<meta name="description" content="덩크시티 다이너스티(Dunk City Dynasty) 한국 서버 선수 능력치·티어·포지션 도감. 선수별 덩크·3점·수비 능력치를 한눈에.">
<meta name="theme-color" content="#14110e">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DCD.GG">
<meta property="og:title" content="덩크시티 선수 스탯 · DCD.GG">
<meta property="og:description" content="한국 서버 선수 능력치·티어·포지션 도감. 선수별 능력치를 한눈에.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#14110e; --panel:#1d1915; --panel2:#262019; --line:#352c22; --tx:#f3ece3; --mut:#a79a88;
  --acc:#ff7a2f; --acc2:#ffb27a; --ss:#ff7a2f; --s:#c08bff; --a:#5aa9ff;
  --hi:#49c17a; --lo:#e9646f;
}
:root:not([data-theme="dark"]) @media (prefers-color-scheme:light){}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f6f3ee;--panel:#fff;--panel2:#f3eee7;--line:#e5ddd2;--tx:#241d15;--mut:#7a6f60;--acc2:#c4561a;}
}
:root[data-theme="light"]{--bg:#f6f3ee;--panel:#fff;--panel2:#f3eee7;--line:#e5ddd2;--tx:#241d15;--mut:#7a6f60;--acc2:#c4561a;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* header */
header{background:linear-gradient(180deg,var(--panel),var(--bg));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.hd{display:flex;align-items:center;gap:14px;padding:13px 0;flex-wrap:wrap}
.logo{font-weight:900;font-size:21px;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
.logo .ball{width:28px;height:28px;flex:none;filter:drop-shadow(0 2px 7px rgba(255,122,47,.45))}
.logo b{background:linear-gradient(92deg,var(--acc),#ffd36b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo i{font-style:normal;color:var(--mut);font-weight:700;font-size:13px;margin-left:1px}
.spacer{flex:1}
.search{display:flex;gap:7px;min-width:180px;flex:1;max-width:340px}
.search input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:9px 12px;font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--mut);width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{border-color:var(--acc);color:var(--tx)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* hero */
.hero{padding:18px 0 6px}
.hero h1{font-size:18px;margin:0 0 4px;font-weight:800}
.hero p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.5}
/* filters */
.filters{display:flex;flex-direction:column;gap:9px;padding:14px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lbl{font-size:11px;color:var(--mut);font-weight:700;width:34px;flex:none}
.chip{padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-weight:700;font-size:12.5px;transition:.12s}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--acc);color:#1a1109;border-color:var(--acc)}
.chip.on.q-ss{background:var(--ss)}.chip.on.q-s{background:var(--s);color:#fff}.chip.on.q-a{background:var(--a);color:#fff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 2px}
.sel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px 10px;font-size:16px}
@media(min-width:601px){.sel{font-size:13px}}
.count{color:var(--mut);font-size:12px;margin-left:auto}
.viewtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewtog button{background:var(--panel);border:0;color:var(--mut);padding:7px 11px;cursor:pointer;font-weight:700;font-size:12px}
.viewtog button.on{background:var(--acc);color:#1a1109}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px 0 40px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.14s;position:relative}
.pcard:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 8px 24px rgba(0,0,0,.28)}
.pcard .pic{aspect-ratio:1/1;background:radial-gradient(120% 120% at 50% 0,var(--panel2),var(--panel));overflow:hidden}
.pcard .pic img{width:100%;height:100%;object-fit:cover;object-position:center top}
.pcard .ov{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:3px 8px;font-weight:900;font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.pcard .qbadge{position:absolute;top:9px;right:9px;font-weight:900;font-size:11px;padding:3px 7px;border-radius:7px;color:#1a1109}
.q-ss{background:var(--ss)}.q-s{background:var(--s);color:#fff}.q-a{background:var(--a);color:#fff}
.pcard .meta{padding:9px 11px 11px}
.pcard .nm{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sub{color:var(--mut);font-size:11.5px;margin-top:2px;display:flex;gap:6px}
.pcard .posdot{color:var(--acc2);font-weight:700}
/* table */
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0 40px;display:none}
.tbl.show{display:table}
.tbl th,.tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th:nth-child(-n+2),.tbl td:nth-child(-n+2){text-align:left}
.tbl th{color:var(--mut);font-size:11px;font-weight:700;background:var(--panel2);cursor:pointer}
.tbl th.on{color:var(--acc)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl .pn{display:flex;align-items:center;gap:8px}
.tbl .pn img{width:28px;height:28px;border-radius:6px;object-fit:cover;object-position:center top;background:var(--panel2)}
.tbl .hi{color:var(--hi);font-weight:700}
.scrollx{overflow-x:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;min-height:min(640px,90vh);overscroll-behavior:contain}
.sheet .top{display:flex;gap:16px;padding:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet .av{width:128px;height:128px;border-radius:14px;overflow:hidden;background:radial-gradient(120% 120% at 50% 0,var(--panel2),var(--panel));flex:none}
.sheet .av img{width:100%;height:100%;object-fit:cover;object-position:center top}
.sheet .who{flex:1;min-width:180px}
.sheet .who .nm{font-size:26px;font-weight:900;letter-spacing:-.5px}
.sheet .who .en{color:var(--mut);font-weight:700;font-size:13px;margin-top:1px}
.sheet .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:700}
.tag.pos{color:var(--acc2)}
.ovr{margin-top:12px;display:flex;align-items:baseline;gap:8px}
.ovr b{font-size:34px;font-weight:900;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.ovr span{color:var(--mut);font-size:12px}
.closeb{margin-left:auto;align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--mut);width:34px;height:34px;cursor:pointer;font-size:18px;flex:none}
.body{padding:18px;display:grid;grid-template-columns:236px 1fr;gap:18px;align-items:center}
.sheet .who .full{color:var(--tx);font-weight:700;font-size:13.5px;margin-top:3px}
.sheet .who .full em{font-style:normal;color:var(--mut);font-weight:600}
.sheet .desc{margin-top:8px;color:var(--acc2);font-weight:800;font-size:13px}
.sheet .desc::before{content:"“"}.sheet .desc::after{content:"”"}
/* detail tabs */
.tabs{position:sticky;top:0;z-index:2;display:flex;background:var(--panel);border-bottom:1px solid var(--line);padding:0 10px}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font-weight:800;font-size:13.5px;padding:12px 4px 10px;cursor:pointer;white-space:nowrap}
.tabs button small{font-size:11px;font-weight:700;opacity:.75;margin-left:3px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{padding:18px}
.pane[hidden]{display:none}
.pane.body{display:grid}.pane.body[hidden]{display:none}
.sec{font-size:12px;font-weight:800;color:var(--mut);margin:0 0 9px;letter-spacing:.2px}
.sec+.sec,.sec.mt{margin-top:20px}
.prof{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.prof div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.prof dt{font-size:11px;color:var(--mut);font-weight:700}
.prof dd{margin:3px 0 0;font-weight:800;font-size:13.5px;overflow-wrap:anywhere}
.ps{line-height:1.75;font-size:13.5px;margin:0;white-space:pre-line}
.ps.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--acc2);font-weight:800;font-size:12.5px;padding:7px 12px;cursor:pointer}
.more:hover{border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:9px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.item .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .h b{font-size:14.5px;font-weight:800}
.item p{margin:6px 0 0;color:var(--mut);font-size:13px;line-height:1.65}
.item.ult{border-color:rgba(255,122,47,.55);background:linear-gradient(135deg,rgba(255,122,47,.13),var(--panel2) 60%)}
.rb{font-size:11px;font-weight:900;padding:3px 7px;border-radius:6px;line-height:1.2;flex:none}
.rb.r-ult{background:var(--acc);color:#1a1109}
.rb.r-pas{background:var(--s);color:#fff}
.rb.r-sk{background:var(--panel);color:var(--acc2);border:1px solid var(--line)}
.bond-ic{width:26px;height:26px;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:13px;flex:none}
.note{color:var(--mut);font-size:11.5px;margin-top:12px;line-height:1.6}
@media(max-width:560px){
  .body{grid-template-columns:1fr}.sheet .av{width:88px;height:88px}
  .modal{padding:0;align-items:flex-end}
  .sheet{border-radius:18px 18px 0 0;height:92vh;height:92dvh;max-height:none;min-height:0;border-bottom:0}
  .sheet .top{padding:16px 14px 14px;gap:13px;flex-wrap:nowrap}
  .sheet .who{min-width:0}
  .sheet .who .nm{font-size:22px}
  .ovr{margin-top:10px}.ovr b{font-size:28px}
  .tabs{padding:0 4px}
  .pane{padding:16px 14px 28px}
  .pane.body .radar{max-width:280px;margin:0 auto;display:block}
  .prof{grid-template-columns:1fr 1fr}
}
.radar{width:100%;height:auto}
.radar text{fill:var(--mut);font-size:9px;font-weight:700}
.radar .poly{fill:rgba(255,122,47,.25);stroke:var(--acc);stroke-width:2}
.radar .grid{fill:none;stroke:var(--line);stroke-width:1}
.radar .axis{stroke:var(--line);stroke-width:1}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:56px 1fr 30px;align-items:center;gap:9px}
.bar .k{font-size:12px;color:var(--mut);font-weight:700}
.bar .t{display:block;height:9px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar .f{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),#ffd36b)}
.bar .v{font-size:12.5px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.bar .v.hi{color:var(--hi)}
.bar.rk{grid-template-columns:56px 1fr 30px 34px}
.bar .r{font-size:11px;color:var(--mut);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bar .r.best{color:var(--acc2)}
.ranks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ranks span{font-size:11.5px;color:var(--mut);font-weight:700}
.ranks b{color:var(--tx)}
.cmpbtn{margin-left:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--acc2);font-weight:800;font-size:12px;padding:5px 10px;cursor:pointer}
.cmpbtn:hover{border-color:var(--acc)}
/* compare */
.cmp{padding:12px 0 40px}
.cmp[hidden]{display:none}
.cmp .pick{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.cmp .pick .sel{width:100%;min-width:0}
.cmp .swap{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--mut);width:38px;height:38px;cursor:pointer;font-size:16px}
.cmp .swap:hover{border-color:var(--acc);color:var(--tx)}
.cmp .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.cmp .heads{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.cmp .head{display:flex;gap:10px;align-items:center;padding:12px;cursor:pointer;min-width:0}
.cmp .head+.head{border-left:1px solid var(--line);flex-direction:row-reverse;text-align:right}
.cmp .head img{width:52px;height:52px;border-radius:10px;object-fit:cover;object-position:center top;background:var(--panel2);flex:none}
.cmp .head .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .head .sub{color:var(--mut);font-size:11.5px;font-weight:700;margin-top:2px}
.cmp .head .o{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.cmp .head.a .o,.cmp .lg .a{color:var(--acc)}.cmp .head.b .o,.cmp .lg .b{color:var(--a)}
.cmp .head>div{min-width:0}
.cmp .body2{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:16px;align-items:center}
.cmp .lg{display:flex;justify-content:center;gap:14px;font-size:12px;font-weight:800;margin-top:4px}
.cmp .sum{text-align:center;color:var(--mut);font-size:12.5px;font-weight:700;margin-top:6px}
.cmp .sum b{color:var(--tx)}
.radar .poly.b{fill:rgba(90,169,255,.22);stroke:var(--a)}
.crow{display:grid;grid-template-columns:30px 1fr 56px 1fr 30px;align-items:center;gap:7px;padding:3px 0}
.crow .k{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.crow .v{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.crow .v:last-child{text-align:left}
.crow .v.w{color:var(--hi)}
.crow .t{height:9px;background:var(--panel2);border-radius:999px;overflow:hidden;display:flex}
.crow .t.l{justify-content:flex-end}
.crow .t span{display:block;height:100%;border-radius:999px}
.crow .t.l span{background:linear-gradient(270deg,var(--acc),#ffd36b)}
.crow .t.r span{background:linear-gradient(90deg,var(--a),#9fd0ff)}
@media(max-width:700px){.cmp .body2{grid-template-columns:1fr}.cmp .body2 .radar{max-width:320px;margin:0 auto;display:block}}
@media(max-width:400px){.cmp .head img{width:42px;height:42px}.cmp .head .nm{font-size:14.5px}.cmp .head .o{font-size:19px}}
footer{border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;padding:18px 0 40px;line-height:1.7}
footer b{color:var(--tx)}
.disc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="logo">
      <svg class="ball" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#ff7a2f"/><path d="M2 12h20M12 2v20M4.9 4.9c3 2.4 3 11.8 0 14.2M19.1 4.9c-3 2.4-3 11.8 0 14.2" stroke="#1a1109" stroke-width="1.4"/></svg>
      <span>DUNK CITY <b>스탯</b> <i>DCD.GG</i></span>
    </div>
    <div class="spacer"></div>
    <div class="search"><input id="q" type="search" placeholder="선수 검색 (예: 커리, James)" autocomplete="off"></div>
    <button class="iconbtn" id="theme" title="테마 전환" aria-label="테마 전환"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>한국 서버 선수 능력치 도감</h1>
    <p>현재 한국 서버에서 플레이할 수 있는 선수들의 능력치입니다. 카드를 눌러 능력치·프로필·스킬·케미를 확인하세요.</p>
  </div>

  <div class="filters">
    <div class="chips" id="posChips">
      <span class="lbl">포지션</span>
      <span class="chip on" data-pos="">전체</span>
      <span class="chip" data-pos="PG">PG</span><span class="chip" data-pos="SG">SG</span>
      <span class="chip" data-pos="SF">SF</span><span class="chip" data-pos="PF">PF</span><span class="chip" data-pos="C">C</span>
    </div>
    <div class="chips" id="qChips">
      <span class="lbl">등급</span>
      <span class="chip on" data-q="">전체</span>
      <span class="chip" data-q="SS">SS</span><span class="chip" data-q="S">S</span><span class="chip" data-q="A">A</span>
    </div>
    <div class="toolbar">
      <select class="sel" id="sort"></select>
      <div class="viewtog"><button id="vGrid" class="on">카드</button><button id="vTable">표</button><button id="vCmp">비교</button></div>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="scrollx"><table class="tbl" id="tbl"></table></div>
  <section class="cmp" id="cmp" hidden></section>

  <footer>
    <div>데이터: 덩크시티 다이너스티 설치본에서 추출 · 업데이트 <b id="upd"></b></div>
    <div class="disc">
      비공식 팬 제작 페이지입니다. 선수 이름·이미지의 권리는 넷이즈와 각 권리자에게 있습니다.
      능력치는 게임 데이터 기준이며 업데이트로 바뀔 수 있습니다. 한국 서버 미출시 선수는 포함하지 않았습니다.
    </div>
  </footer>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="data.js"></script>
<script>
const D = window.DCD, LAB = D.statLabels, PL = D.players;
document.getElementById('upd').textContent = D.updated;
const ovr = p => Math.round(Object.values(p.stats).reduce((a,b)=>a+b,0)/LAB.length);
PL.forEach(p => p.ovr = ovr(p));

let fPos='', fQ='', fText='', sortKey='ovr', view='grid';

// sort options
const sortSel = document.getElementById('sort');
sortSel.innerHTML = '<option value="ovr">평균 능력치 순</option>' +
  LAB.map(([k,l])=>`<option value="${k}">${l} 순</option>`).join('');

function filtered(){
  let a = PL.filter(p =>
    (!fPos || p.pos===fPos) && (!fQ || p.quality===fQ) &&
    (!fText || (p.name+p.kr+p.cn+(p.full||'')+(p.nick||'')).toLowerCase().includes(fText)));
  a.sort((x,y)=> (sortKey==='ovr'? y.ovr-x.ovr : y.stats[sortKey]-x.stats[sortKey]));
  return a;
}
// 비교: 기본은 평균 능력치 1·2위
const byOvr=[...PL].sort((x,y)=>y.ovr-x.ovr);
let cmpA=byOvr[0].id, cmpB=byOvr[1].id;
function renderCmp(){
  const A=PL.find(p=>p.id==cmpA), B=PL.find(p=>p.id==cmpB), el=document.getElementById('cmp');
  const opts=sel=>[...PL].sort((x,y)=>x.kr.localeCompare(y.kr,'ko')).map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.kr)} · ${p.pos} ${p.quality}</option>`).join('');
  let wa=0,wb=0; LAB.forEach(([k])=>{if(A.stats[k]>B.stats[k])wa++;else if(B.stats[k]>A.stats[k])wb++});
  const head=(p,c)=>`<div class="head ${c}" data-id="${p.id}">${p.img?`<img src="${p.img}" alt="">`:''}<div><div class="nm">${esc(p.kr)}</div><div class="sub">${p.pos} · ${p.quality}급</div></div><div class="o">${p.ovr}</div></div>`;
  el.innerHTML=`
    <div class="pick"><select class="sel" id="cA" aria-label="선수 A">${opts(cmpA)}</select>
      <button class="swap" title="좌우 바꾸기" aria-label="좌우 바꾸기">⇄</button>
      <select class="sel" id="cB" aria-label="선수 B">${opts(cmpB)}</select></div>
    <div class="card">
      <div class="heads">${head(A,'a')}${head(B,'b')}</div>
      <div class="body2">
        <div>${radar(A.stats,B.stats)}
          <div class="lg"><span class="a">● ${esc(A.kr)}</span><span class="b">● ${esc(B.kr)}</span></div>
          <div class="sum">우세 항목 <b>${wa}</b> : <b>${wb}</b></div></div>
        <div>${LAB.map(([k,l])=>{const a=A.stats[k],b=B.stats[k];return `
          <div class="crow"><span class="v ${a>b?'w':''}">${a}</span><span class="t l"><span style="width:${a}%"></span></span>
          <span class="k">${l}</span><span class="t r"><span style="width:${b}%"></span></span><span class="v ${b>a?'w':''}">${b}</span></div>`}).join('')}</div>
      </div>
    </div>`;
  try{history.replaceState(history.state,'',`#vs/${cmpA}/${cmpB}`)}catch(e){}
}
function maxOf(k){ return Math.max(...PL.map(p=> k==='ovr'?p.ovr:p.stats[k])); }

function render(){
  const a = filtered();
  document.getElementById('count').textContent = a.length + '명';
  const grid = document.getElementById('grid'), tbl = document.getElementById('tbl'), cmp=document.getElementById('cmp');
  cmp.hidden = view!=='cmp';
  if(view==='cmp'){ grid.style.display='none'; tbl.classList.remove('show'); document.getElementById('count').textContent=''; renderCmp(); return; }
  if(view==='grid'){
    grid.style.display=''; tbl.classList.remove('show');
    grid.innerHTML = a.map(p=>`
      <div class="pcard" data-id="${p.id}">
        <div class="pic">${p.img?`<img loading="lazy" src="${p.img}" alt="${p.name}">`:''}</div>
        <div class="ov">${p.ovr}</div>
        <div class="qbadge q-${p.quality.toLowerCase()}">${p.quality}</div>
        <div class="meta"><div class="nm">${p.kr}</div>
          <div class="sub"><span class="posdot">${p.pos}</span><span>${D.io[p.io]||''}</span></div></div>
      </div>`).join('');
  } else {
    grid.style.display='none'; tbl.classList.add('show');
    const cols = [['ovr','평균'],...LAB];
    const mx = {}; cols.forEach(([k])=> mx[k]=maxOf(k));
    tbl.innerHTML = `<thead><tr><th>선수</th><th>포지션</th>`+
      cols.map(([k,l])=>`<th class="${sortKey===k?'on':''}" data-k="${k}">${l}</th>`).join('')+`</tr></thead>`+
      `<tbody>`+a.map(p=>`<tr data-id="${p.id}"><td><div class="pn">${p.img?`<img src="${p.img}">`:''}<div><b>${p.kr}</b><div style="color:var(--mut);font-size:11px">${p.name}</div></div></div></td>`+
        `<td><span class="q-${p.quality.toLowerCase()}" style="padding:1px 6px;border-radius:5px;font-size:11px;font-weight:800">${p.quality}</span> ${p.pos}</td>`+
        cols.map(([k])=>{const v=k==='ovr'?p.ovr:p.stats[k];return `<td class="${v===mx[k]?'hi':''}">${v}</td>`}).join('')+`</tr>`).join('')+`</tbody>`;
  }
}

// radar
function radar(...series){ // series: stats 객체 여러 개 → 겹쳐 그림
  const n=LAB.length, R=78, cx=95, cy=95;
  const top=Math.max(100,...series.flatMap(s=>LAB.map(([k])=>s[k]||0)));
  const grids=[0.25,0.5,0.75,1].map(g=>{
    let d='';for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+Math.cos(a)*R*g,y=cy+Math.sin(a)*R*g;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
    return `<path class="grid" d="${d}Z"/>`}).join('');
  let axes='',labels='';
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
    axes+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const lx=cx+Math.cos(a)*(R+13),ly=cy+Math.sin(a)*(R+13);
    const anc=Math.abs(Math.cos(a))<0.3?'middle':(Math.cos(a)>0?'start':'end');
    labels+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="${anc}">${LAB[i][1]}</text>`;
  }
  const polys=series.map((st,j)=>{const d='M'+LAB.map(([k],i)=>{const a=-Math.PI/2+i*2*Math.PI/n,v=(st[k]||0)/top;
    return (cx+Math.cos(a)*R*v).toFixed(1)+' '+(cy+Math.sin(a)*R*v).toFixed(1)}).join('L')+'Z';
    return `<path class="poly ${j?'b':''}" d="${d}"/>`}).join('');
  return `<svg class="radar" viewBox="-26 -4 242 198">${grids}${axes}${polys}${labels}</svg>`;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HAN = /[一-鿿]/; // 케미 이야기 중 한국어 번역이 아직 없는(중문) 것은 숨긴다
const PROF = [['birthPlace','출생지'],['birth','생일'],['height','키'],['weight','몸무게'],['hand','주손'],['number','등번호'],['hobby','취미']];
const ROLE = {'궁극기':['r-ult',0],'패시브':['r-pas',1],'스킬':['r-sk',2]};
let tab='stats';
// 능력치별 전체 순위(동점은 같은 순위)
const RANK={};
[['ovr'],...LAB].forEach(([k])=>{const val=p=>k==='ovr'?p.ovr:p.stats[k];RANK[k]={};PL.forEach(p=>RANK[k][p.id]=1+PL.filter(q=>val(q)>val(p)).length)});
const posRank=p=>1+PL.filter(q=>q.pos===p.pos&&q.ovr>p.ovr).length, posCnt=pos=>PL.filter(q=>q.pos===pos).length;

function openP(id){
  const p = PL.find(x=>x.id==id); if(!p) return;
  const mx={}; LAB.forEach(([k])=>mx[k]=maxOf(k));
  const pr = p.profile||{}, skills=[...(p.skills||[])].sort((a,b)=>(ROLE[a.role]?.[1]??3)-(ROLE[b.role]?.[1]??3)), bonds=p.bonds||[];
  const alias = [p.full&&p.full!==p.kr?p.full:'', p.nick&&p.nick!==p.kr&&p.nick!==p.full?`별명 ${p.nick}`:''].filter(Boolean);
  const tabs = [['stats','능력치'],['prof','프로필'],['skill','스킬',skills.length],['bond','케미',bonds.length]];
  document.getElementById('sheet').innerHTML = `
    <div class="top">
      <div class="av">${p.img?`<img src="${p.img}" alt="${esc(p.kr)}">`:''}</div>
      <div class="who"><div class="nm">${esc(p.kr)}</div>
        ${alias.length?`<div class="full">${esc(alias[0])}${alias[1]?` <em>· ${esc(alias[1])}</em>`:''}</div>`:''}
        <div class="en">${esc(p.name)} · ${esc(p.cn)}</div>
        ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:''}
        <div class="tags"><span class="tag pos">${p.pos} ${D.pos[p.pos]||''}</span>
          <span class="tag q-${p.quality.toLowerCase()}">${p.quality}급</span>
          <span class="tag">${D.io[p.io]||''}</span></div>
        <div class="ovr"><b>${p.ovr}</b><span>평균 능력치</span><button class="cmpbtn" data-cmp="${p.id}">⇄ 비교</button></div>
        <div class="ranks"><span>전체 <b>${RANK.ovr[p.id]}위</b>/${PL.length}</span><span>·</span><span>${p.pos} <b>${posRank(p)}위</b>/${posCnt(p.pos)}</span></div>
      </div>
      <button class="closeb" onclick="closeM()" aria-label="닫기">×</button>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k,l,n])=>
      `<button role="tab" data-tab="${k}" class="${tab===k?'on':''}" aria-selected="${tab===k}">${l}${n!=null?`<small>${n}</small>`:''}</button>`).join('')}</div>
    <div class="pane body" data-pane="stats">
      <div>${radar(p.stats)}</div>
      <div class="bars">${LAB.map(([k,l])=>{const v=p.stats[k];return `
        <div class="bar rk"><span class="k">${l}</span><span class="t"><span class="f" style="width:${v}%"></span></span>
        <span class="v ${v===mx[k]?'hi':''}">${v}</span><span class="r ${RANK[k][p.id]<=3?'best':''}">${RANK[k][p.id]}위</span></div>`}).join('')}</div>
    </div>
    <div class="pane" data-pane="prof">
      <h3 class="sec">기본 정보</h3>
      <dl class="prof" style="margin:0">${PROF.filter(([k])=>pr[k]).map(([k,l])=>
        `<div><dt>${l}</dt><dd>${esc(k==='number'?'#'+pr[k]:pr[k])}</dd></div>`).join('')}</dl>
      ${pr.playStyle?`<h3 class="sec mt">플레이스타일</h3>
        <p class="ps clamp" id="ps">${esc(pr.playStyle)}</p>
        <button class="more" id="psMore" aria-expanded="false">펼치기 ▾</button>`:''}
    </div>
    <div class="pane" data-pane="skill">
      <div class="list">${skills.map(s=>{const r=ROLE[s.role]||['r-sk'];return `
        <div class="item ${r[0]==='r-ult'?'ult':''}"><div class="h"><span class="rb ${r[0]}">${esc(s.role)}</span><b>${esc(s.name)}</b></div>
        ${s.desc?`<p>${esc(s.desc)}</p>`:''}</div>`}).join('')||'<div class="note">스킬 정보가 없습니다.</div>'}</div>
    </div>
    <div class="pane" data-pane="bond">
      <div class="list">${bonds.map(b=>`
        <div class="item"><div class="h"><span class="bond-ic">♥</span><b>${esc(b.name)}</b></div>
        ${b.content&&!HAN.test(b.content)?`<p>${esc(b.content)}</p>`:''}</div>`).join('')||'<div class="note">케미 정보가 없습니다.</div>'}</div>
      ${bonds.some(b=>b.content&&HAN.test(b.content))?'<div class="note">케미 이야기 본문은 한국어 번역을 준비 중입니다.</div>':''}
    </div>`;
  showTab(tab);
  const sh=document.getElementById('sheet'); sh.scrollTop=0;
  const m=document.getElementById('modal');
  if(!m.classList.contains('show')){
    m.classList.add('show'); document.body.style.overflow='hidden';
    try{history.pushState({dcdModal:1},'')}catch(e){}
  }
}
function showTab(k){
  tab=k;
  document.querySelectorAll('#sheet .tabs button').forEach(b=>{const on=b.dataset.tab===k;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  document.querySelectorAll('#sheet .pane').forEach(el=>el.hidden=el.dataset.pane!==k);
}
function hideM(){document.getElementById('modal').classList.remove('show');document.body.style.overflow=''}
function closeM(){ if(history.state&&history.state.dcdModal) history.back(); else hideM(); }
let afterClose=null; // 모달을 뒤로가기로 닫은 다음 할 일(비교 화면 전환)
window.addEventListener('popstate',()=>{hideM();if(afterClose){const f=afterClose;afterClose=null;f()}});
try{if(history.state&&history.state.dcdModal)history.replaceState(null,'')}catch(e){} // 새로고침 시 남은 모달 기록 정리
document.getElementById('sheet').addEventListener('click',e=>{
  e.stopPropagation();
  const t=e.target.closest('.tabs button'); if(t){showTab(t.dataset.tab);return;}
  const cb=e.target.closest('[data-cmp]'); if(cb){const p=PL.find(x=>x.id==cb.dataset.cmp);cmpA=p.id;
    cmpB=(byOvr.find(q=>q.pos===p.pos&&q.id!==p.id)||byOvr.find(q=>q.id!==p.id)).id;
    const go=()=>{setView('cmp');window.scrollTo({top:document.getElementById('cmp').offsetTop-80})};
    if(history.state&&history.state.dcdModal){afterClose=go;history.back()}else{hideM();go()} return;}
  if(e.target.id==='psMore'){const ps=document.getElementById('ps');const open=ps.classList.toggle('clamp')===false;
    e.target.textContent=open?'접기 ▴':'펼치기 ▾';e.target.setAttribute('aria-expanded',open);}
});

// events
document.getElementById('posChips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('#posChips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');fPos=c.dataset.pos;render()};
document.getElementById('qChips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('#qChips .chip').forEach(x=>{x.classList.remove('on','q-ss','q-s','q-a')});
  c.classList.add('on');if(c.dataset.q)c.classList.add('q-'+c.dataset.q.toLowerCase());fQ=c.dataset.q;render()};
document.getElementById('q').oninput=e=>{fText=e.target.value.trim().toLowerCase();render()};
sortSel.onchange=e=>{sortKey=e.target.value;render()};
function setView(v){view=v;if(v!=='cmp'&&location.hash.startsWith('#vs/'))try{history.replaceState(history.state,'',location.pathname+location.search)}catch(e){}
  [['grid','vGrid'],['table','vTable'],['cmp','vCmp']].forEach(([k,id])=>document.getElementById(id).classList.toggle('on',k===v));render()}
document.getElementById('vGrid').onclick=()=>setView('grid');
document.getElementById('vTable').onclick=()=>setView('table');
document.getElementById('vCmp').onclick=()=>setView('cmp');
document.getElementById('cmp').addEventListener('change',e=>{if(e.target.id==='cA')cmpA=+e.target.value;if(e.target.id==='cB')cmpB=+e.target.value;renderCmp()});
document.getElementById('cmp').addEventListener('click',e=>{if(e.target.closest('.swap')){[cmpA,cmpB]=[cmpB,cmpA];renderCmp()}});
document.body.addEventListener('click',e=>{
  const row=e.target.closest('[data-id]'); if(row){openP(row.dataset.id);return;}
  const th=e.target.closest('th[data-k]'); if(th){sortKey=th.dataset.k;sortSel.value=LAB.some(l=>l[0]===sortKey)?sortKey:'ovr';render();}
});
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
// theme
const TH=document.getElementById('theme');
try{const t=localStorage.getItem('dcd-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
TH.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',cur);try{localStorage.setItem('dcd-theme',cur)}catch(e){}};
{const m=location.hash.match(/^#vs\/(\d+)\/(\d+)$/);
 if(m&&PL.some(p=>p.id==m[1])&&PL.some(p=>p.id==m[2])){cmpA=+m[1];cmpB=+m[2];setView('cmp')} else render();}
</script>
